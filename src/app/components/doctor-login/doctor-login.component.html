<div class="auth-container">
  <div class="auth-card">
    <div class="text-center mb-3">
      <div class="icon-badge">
        <i class="fa fa-stethoscope"></i>
      </div>
      <h1 class="brand-title">Doctor Portal</h1>
      <p class="subtitle">Access your patients and appointments</p>
    </div>

    <div class="alert alert-danger" *ngIf="inValidLogin">
      Invalid username or password. Please try again.
    </div>

    <form (ngSubmit)="checkLogin()">
      <div class="form-group">
        <label>Username</label>
        <input type="text" class="form-control" placeholder="Enter doctor username" [(ngModel)]="username"
          name="username" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" class="form-control" placeholder="Enter password" [(ngModel)]="password" name="password"
          required>
      </div>

      <button type="submit" class="btn-primary-custom">
        <i class="fa fa-sign-in"></i> Login to Dashboard
      </button>
    </form>

    <div class="footer-links">
      <a routerLink="/home" class="back-link">← Back to Home</a>
    </div>
  </div>
</div>
