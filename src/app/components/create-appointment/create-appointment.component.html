<nav class="navbar navbar-premium navbar-dark">
    <a class="navbar-brand" routerLink="/appointmentlist">CURANET</a>
    <div class="ml-auto">
        <button class="btn btn-outline-light" routerLink="/appointmentlist">Back to List</button>
        <button class="btn btn-danger-premium ml-2" (click)="logout()">Logout</button>
    </div>
</nav>

<div class="container mt-5">
    <div class="glass-card mx-auto" style="max-width: 600px;">
        <h2 class="text-center mb-4" style="color: var(--primary);">Book New Appointment</h2>
        <form (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label>Patient Name</label>
                <input type="text" name="name" class="form-control" placeholder="Enter patient name"
                    [(ngModel)]="appointment.name" required>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Age</label>
                        <input type="number" name="age" class="form-control" placeholder="Age"
                            [(ngModel)]="appointment.age">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Appointment Date</label>
                        <input type="date" name="date" class="form-control" [(ngModel)]="appointment.date" required>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Time Slot</label>
                <input type="time" name="time" class="form-control" [(ngModel)]="appointment.time" required>
            </div>

            <div class="form-group">
                <label>Symptoms</label>
                <textarea name="symtoms" class="form-control" placeholder="Describe symptoms..." rows="3"
                    [(ngModel)]="appointment.symtoms"></textarea>
            </div>

            <button type="submit" class="btn btn-premium btn-block mt-4">Confirm Appointment</button>
        </form>
    </div>
</div>
