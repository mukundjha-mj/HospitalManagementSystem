<div class="auth-container">
  <div class="auth-card">
    <div class="text-center mb-3">
      <div class="icon-badge">
        <i class="fa fa-user-shield"></i>
      </div>
      <h1 class="brand-title">Admin Portal</h1>
      <p class="subtitle">Secure System Access</p>
    </div>

    <div class="alert alert-danger" *ngIf="false">
      <!-- Placeholder for error message logic if needed later -->
      Invalid username or password.
    </div>

    <form>
      <div class="form-group">
        <label>Username</label>
        <div class="input-wrapper">
          <i class="fa fa-user"></i>
          <input type="text" class="form-control" placeholder="Enter admin username" [(ngModel)]="username"
            name="username" required>
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrapper">
          <i class="fa fa-lock"></i>
          <input type="password" class="form-control" placeholder="Enter password" [(ngModel)]="password"
            name="password" required>
        </div>
      </div>

      <button (click)="checkLogin()" class="btn-primary-custom">
        <i class="fa fa-sign-in"></i> Login Securely
      </button>
    </form>

    <div class="footer-links">
      <a routerLink="/home" class="back-link">← Return to Home</a>
    </div>
  </div>
</div>
