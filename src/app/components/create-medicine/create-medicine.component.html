<nav class="navbar navbar-premium navbar-dark">
    <a class="navbar-brand" routerLink="/doctor">CURANET</a>
    <div class="ml-auto">
        <button class="btn btn-outline-light" routerLink="/view-medicine">Back to List</button>
        <button class="btn btn-danger-premium ml-2" (click)="logout()">Logout</button>
    </div>
</nav>

<div class="container mt-5">
    <div class="glass-card mx-auto" style="max-width: 600px;">
        <h2 class="text-center mb-4" style="color: var(--primary);">Add New Medicine Details</h2>
        <form (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label>Drug Name</label>
                <input type="text" name="name" class="form-control" placeholder="Enter drug name"
                    [(ngModel)]="medicine.name" required>
            </div>
            <div class="form-group">
                <label>Price</label>
                <div class="input-group">
                    <div class="input-group-prepend">
                        <span class="input-group-text">$</span>
                    </div>
                    <input type="text" name="price" class="form-control" placeholder="0.00"
                        [(ngModel)]="medicine.price">
                </div>
            </div>
            <div class="form-group">
                <label>Stock Quantity</label>
                <input type="number" name="stock" class="form-control" placeholder="Enter quantity"
                    [(ngModel)]="medicine.stock">
            </div>
            <div class="form-group">
                <label>Expiry Date</label>
                <input type="text" name="expirydate" class="form-control" placeholder="DD-MM-YYYY"
                    [(ngModel)]="medicine.expirydate">
            </div>

            <button type="submit" class="btn btn-premium btn-block mt-4">Add Medicine</button>
        </form>
    </div>
</div>
