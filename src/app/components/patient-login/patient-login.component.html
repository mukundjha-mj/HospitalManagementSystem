<div class="auth-container">
    <div class="auth-card">
        <div class="text-center mb-3">
            <h1 class="brand-title">CURANET</h1>
            <p class="subtitle">Patient Portal</p>
        </div>

        <!-- Tab Navigation -->
        <div class="tab-nav">
            <button class="tab-btn" [class.active]="activeTab === 'login'" (click)="activeTab = 'login'">Login</button>
            <button class="tab-btn" [class.active]="activeTab === 'register'"
                (click)="activeTab = 'register'">Register</button>
        </div>

        <div class="alert alert-danger" *ngIf="errorMessage">
            {{errorMessage}}
        </div>
        <div class="alert alert-success" *ngIf="successMessage">
            {{successMessage}}
        </div>

        <!-- Login Form -->
        <form *ngIf="activeTab === 'login'" (ngSubmit)="onLogin()" class="auth-form">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" class="form-control" placeholder="Enter your email" [(ngModel)]="email" name="email"
                    required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" class="form-control" placeholder="Enter your password" [(ngModel)]="password"
                    name="password" required>
            </div>

            <button type="submit" class="btn-primary-custom" [disabled]="isLoading">
                <span *ngIf="!isLoading">Login to My Health Portal</span>
                <span *ngIf="isLoading">Authenticating...</span>
            </button>
        </form>

        <!-- Register Form -->
        <form *ngIf="activeTab === 'register'" (ngSubmit)="onRegister()" class="auth-form">
            <div class="form-row">
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" class="form-control" placeholder="Your name" [(ngModel)]="registerData.pname"
                        name="pname" required>
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" class="form-control" placeholder="your@email.com"
                        [(ngModel)]="registerData.email" name="remail" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Password *</label>
                    <input type="password" class="form-control" placeholder="Create password"
                        [(ngModel)]="registerData.password" name="rpassword" required>
                </div>
                <div class="form-group">
                    <label>Phone *</label>
                    <input type="text" class="form-control" placeholder="Mobile number"
                        [(ngModel)]="registerData.pnumber" name="pnumber" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Age</label>
                    <input type="number" class="form-control" placeholder="Age" [(ngModel)]="registerData.age"
                        name="age">
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <select class="form-control" [(ngModel)]="registerData.gender" name="gender">
                        <option value="">Select</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Blood Group</label>
                    <select class="form-control" [(ngModel)]="registerData.bloodGroup" name="bloodGroup">
                        <option value="">Select</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>City</label>
                <input type="text" class="form-control" placeholder="Your city" [(ngModel)]="registerData.pcity"
                    name="pcity">
            </div>

            <button type="submit" class="btn-success-custom" [disabled]="isLoading">
                <span *ngIf="!isLoading"><i class="fa fa-user-plus"></i> Create My Account</span>
                <span *ngIf="isLoading">Creating account...</span>
            </button>
        </form>

        <div class="footer-links">
            <p>Are you a healthcare provider?</p>
            <div class="provider-links">
                <a routerLink="/doc-login">Doctor Login</a>
                <a routerLink="/admin-login">Admin Login</a>
            </div>
            <a routerLink="/home" class="back-link">← Back to Home</a>
        </div>
    </div>
</div>
